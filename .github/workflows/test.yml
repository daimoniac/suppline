name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: suppline
          POSTGRES_PASSWORD: suppline
          POSTGRES_DB: suppline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suppline -d suppline"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SUPPLINE_TEST_POSTGRES_URL: postgres://suppline:suppline@localhost:5432/suppline?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: |
          mkdir -p build/swagger
          swag init -g internal/api/api.go -o build/swagger --parseDependency --parseInternal

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./internal/...

      # Separate Go module, not covered by ./internal/... above.
      - name: Run clusterstate-agent unit tests
        working-directory: clusterstate-agent
        run: go test -race ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: |
          mkdir -p build/swagger
          swag init -g internal/api/api.go -o build/swagger --parseDependency --parseInternal

      # Pinned: building from master made the enforced rule set drift with
      # upstream, so untouched code could start failing on any given day.
      # v2.13.2 cannot read Go 1.27.2 export data (version 5).
      # v2.14.0+ can.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      # clusterstate-agent is a separate Go module, so ./... above skips it.
      # It picks up the repo-root .golangci.yml.
      - name: Run golangci-lint (clusterstate-agent)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: clusterstate-agent
          args: --timeout=5m
