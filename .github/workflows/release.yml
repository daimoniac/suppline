# Cut a release: git tag vX.Y.Z && git push origin vX.Y.Z
# Publishes semver images + Helm OCI chart + GitHub Release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository = owner/repo → ghcr.io/daimoniac/suppline
  IMAGE_NAME: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$'; then
            echo "Tag must be vMAJOR.MINOR.PATCH (got v$VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-backend:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ui:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          # UI is Node/nginx — qemu arm64 builds are too slow for a solo release path
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Trivy: use upstream aquasec/trivy (Compose + Helm). No custom image.

  mirror-dockerhub:
    runs-on: ubuntu-latest
    needs: [create-release, build-backend, build-ui]
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror multi-arch images to Docker Hub
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          mirror() {
            local src="$1" dst="$2"
            echo "Mirroring ${src}:${VERSION} -> ${dst}:{${VERSION},${MINOR},${MAJOR},latest}"
            docker buildx imagetools create \
              --tag "${dst}:${VERSION}" \
              --tag "${dst}:${MINOR}" \
              --tag "${dst}:${MAJOR}" \
              --tag "${dst}:latest" \
              "${src}:${VERSION}"
          }
          mirror "ghcr.io/${{ github.repository }}" "daimon666/suppline"
          mirror "ghcr.io/${{ github.repository }}-ui" "daimon666/suppline-ui"

  package-helm:
    runs-on: ubuntu-latest
    needs: [create-release, build-backend, build-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.21.3'

      - name: Set chart version and appVersion
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          sed -i "s/^version:.*/version: $VERSION/" charts/suppline/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/suppline/Chart.yaml
          cat charts/suppline/Chart.yaml

      - name: Package Helm chart
        run: |
          mkdir -p .helm-releases
          helm lint charts/suppline
          helm package charts/suppline -d .helm-releases

      - name: Log in to GHCR (Helm OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to OCI
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          helm push .helm-releases/suppline-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Attach chart to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .helm-releases/*.tgz
