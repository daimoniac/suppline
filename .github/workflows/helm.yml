# Chart lint on PRs and main. Packaging/OCI publish is Release (tag v*).
name: Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/suppline/**'
      - '.github/workflows/helm.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'charts/suppline/**'
      - '.github/workflows/helm.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.21.3'

      - name: Lint Helm chart
        run: helm lint charts/suppline

      - uses: helm/chart-testing-action@v2.6.1

      - name: chart-testing lint
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --charts charts/suppline

      - name: helm template smoke
        run: helm template smoke charts/suppline >/dev/null
