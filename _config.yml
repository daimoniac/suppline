title: suppline
description: Self-hosted Kubernetes image intake gateway — mirror, Trivy scan, CEL policy, Sigstore attestations. Replace supply-chain glue; admit only what passed.
theme: jekyll-theme-minimal
logo: docs/suppline-fullsize.png
show_downloads: true
url: https://suppline.cloud
github:
  repository_url: https://github.com/daimoniac/suppline
  is_project_page: true
  is_user_page: false

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - .git
  - .github
  - .gitignore
  - .dockerignore
  - Dockerfile
  - docker-compose.yml
  - Makefile
  - go.mod
  - go.sum
  - coverage.txt
  - keys
  - build
  - test
  - cmd
  - internal
  - ui
  - charts
  - data
  - .kiro
  - .vscode
  - env.example
  - suppline.yml
  - suppline.yml.example
  - suppline.demo.yml
  - helm-deploy.sh
  - scripts
  - clusterstate-agent
  - grafana
  - CONTEXT.md
  - AGENTS.md
