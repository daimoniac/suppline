# Zero-credential eval stack: checkout → docker compose up → open UI.
# Throwaway registry + demo policies. Not for production.
# Docs: docs/EVAL.md
services:
  registry:
    image: registry:3.1.1
    container_name: suppline-registry
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - suppline
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  suppline:
    image: ghcr.io/daimoniac/suppline
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suppline
    user: "0:0"
    depends_on:
      registry:
        condition: service_healthy
      trivy:
        condition: service_started
    ports:
      - "8080:8080" # API
      - "9090:9090" # Metrics
      - "8081:8081" # Health
    env_file:
      - path: .env
        required: false
    environment:
      - SUPPLINE_CONFIG=/config/suppline.yml
      - SUPPLINE_API_KEY=demo
      - LOG_LEVEL=info
      - METRICS_PORT=9090
      - HEALTH_PORT=8081
      - API_PORT=8080
      - API_ENABLED=true
      - API_READ_ONLY=false
      - QUEUE_BUFFER_SIZE=100
      - WORKER_POLL_INTERVAL=15s
      - WORKER_RETRY_ATTEMPTS=3
      - WORKER_RETRY_BACKOFF=10s
      - TRIVY_SERVER_ADDR=trivy:4954
      - TRIVY_INSECURE=true
      - SCANNER_TIMEOUT=5m
      - STATE_STORE_TYPE=sqlite
      - SQLITE_PATH=/data/suppline.db
      - RESCAN_INTERVAL=24h
      - ATTESTATION_ALLOW_HTTP_REGISTRY=true
      - ATTESTATION_KEY_PASSWORD=demo
      - KEYS_DIR=/keys/demo
    volumes:
      - ./data:/data
      - ./keys:/keys
      - ./suppline.demo.yml:/config/suppline.yml:ro
      - ./scripts/compose-suppline-entrypoint.sh:/compose-suppline-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/compose-suppline-entrypoint.sh"]
    networks:
      - suppline
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ui:
    image: ghcr.io/daimoniac/suppline-ui
    build:
      context: ui
      dockerfile: Dockerfile
    container_name: suppline-ui
    ports:
      - "3000:80"
    environment:
      - API_BASE_URL=/api
      - BACKEND_URL=http://suppline:8080
    depends_on:
      - suppline
    networks:
      - suppline
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  trivy:
    image: aquasec/trivy:0.72.0
    container_name: trivy-server
    command: ["server", "--listen", "0.0.0.0:4954"]
    ports:
      - "4954:4954"
    environment:
      - TRIVY_CACHE_DIR=/trivy-cache
    volumes:
      - trivy-cache:/trivy-cache
    networks:
      - suppline
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4954/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  regsync:
    image: daimon666/regsync:latest
    container_name: regsync
    command: ["server", "-c", "/config/suppline.yml"]
    depends_on:
      registry:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    volumes:
      - ./suppline.demo.yml:/config/suppline.yml:ro
    networks:
      - suppline
    restart: unless-stopped

  # Attestation gate POC (same SCAI checks as Kyverno admit/deny).
  # Usage: docker compose --profile eval-gate run --rm eval-gate
  eval-gate:
    profiles: ["eval-gate"]
    image: ghcr.io/daimoniac/suppline
    user: "0:0"
    depends_on:
      suppline:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      - SUPPLINE_API_URL=http://suppline:8080
      - SUPPLINE_API_KEY=demo
      - EVAL_REGISTRY=registry:5000
      - EVAL_COSIGN_PUBKEY=/keys/demo/cosign.pub
    volumes:
      - ./keys/demo:/keys/demo:ro
      - ./scripts/eval-attestation-gate.sh:/eval-attestation-gate.sh:ro
    networks:
      - suppline
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache curl jq >/dev/null
        exec /bin/sh /eval-attestation-gate.sh

  # Release helper: build/push clusterstate-agent image via docker compose.
  # Usage:
  #   CLUSTERSTATE_AGENT_IMAGE=daimon666/suppline-clusterstate-agent:0.1.0 \
  #     docker compose --profile release build clusterstate-agent-image
  #   CLUSTERSTATE_AGENT_IMAGE=daimon666/suppline-clusterstate-agent:0.1.0 \
  #     docker compose --profile release push clusterstate-agent-image
  clusterstate-agent-image:
    profiles: ["release"]
    image: ${CLUSTERSTATE_AGENT_IMAGE:-daimon666/suppline-clusterstate-agent:latest}
    build:
      context: ./clusterstate-agent
      dockerfile: Dockerfile

  # Deploy helper: install/upgrade clusterstate-agent Helm chart via docker compose.
  # Usage:
  #   CLUSTER_NAME=prod-eu-1 \
  #   SUPPLINE_URL=http://suppline.suppline.svc.cluster.local:8080 \
  #   SUPPLINE_API_KEY=<key> \
  #   CLUSTERSTATE_AGENT_IMAGE_TAG=latest \
  #   docker compose --profile deploy run --rm clusterstate-agent-helm
  clusterstate-agent-helm:
    profiles: ["deploy"]
    image: alpine/helm:4.2.3
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/workspace:ro
      - ${HOME}/.kube:/root/.kube:ro
    environment:
      - HELM_RELEASE_NAME=${HELM_RELEASE_NAME:-clusterstate-agent}
      - HELM_NAMESPACE=${HELM_NAMESPACE:-suppline}
      - WATCH_FLUSH_INTERVAL=${WATCH_FLUSH_INTERVAL:-15s}
      - CLUSTERSTATE_AGENT_IMAGE_REPOSITORY=${CLUSTERSTATE_AGENT_IMAGE_REPOSITORY:-daimon666/suppline-clusterstate-agent}
      - CLUSTERSTATE_AGENT_IMAGE_TAG=${CLUSTERSTATE_AGENT_IMAGE_TAG:-latest}
      - CLUSTER_NAME=${CLUSTER_NAME:-}
      - SUPPLINE_URL=${SUPPLINE_URL:-}
      - SUPPLINE_API_KEY=${SUPPLINE_API_KEY:-}
    entrypoint: ["/bin/sh", "/workspace/scripts/deploy-clusterstate-agent.sh"]

networks:
  suppline:
    driver: bridge

volumes:
  trivy-cache:
    driver: local
  registry-data:
    driver: local
  ui-html:
    driver: local
