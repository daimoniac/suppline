{{- if and (not .Values.postgres.enabled) (not (index (.Values.backend.secrets | default dict) "POSTGRES_URL")) }}
{{- fail "suppline needs PostgreSQL: keep postgres.enabled=true or set backend.secrets.POSTGRES_URL" }}
{{- end }}
{{- if and .Values.persistence.trivyCache.enabled (gt (int .Values.backend.replicaCount) 1) (ne .Values.persistence.trivyCache.accessMode "ReadWriteMany") }}
{{- fail "persistence.trivyCache with more than one replica needs accessMode ReadWriteMany; or leave it disabled for a per-pod emptyDir" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suppline.fullname" . }}
  labels:
    {{- include "suppline.labels" . | nindent 4 }}
spec:
  # One leader runs the pipeline; the others stand by and forward API traffic
  # to it (ADR 0004).
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    {{- toYaml .Values.backend.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "suppline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/trivy-logs: {{ include (print $.Template.BasePath "/trivy-log-wrapper.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.postgres.enabled }}
        checksum/postgres: {{ include (print $.Template.BasePath "/postgres-secret.yaml") . | sha256sum }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ include "suppline.opsPort" . | quote }}
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "suppline.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "suppline.serviceAccountName" . }}
      # Must exceed suppline's 60 s shutdown budget (drain, stop, release).
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: {{ .Values.backend.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
        runAsGroup: {{ .Values.backend.securityContext.runAsGroup }}
        fsGroup: {{ .Values.backend.securityContext.fsGroup }}
      {{- if or .Values.postgres.enabled .Values.registry.enabled }}
      initContainers:
      {{- if .Values.postgres.enabled }}
      - name: wait-postgres
        image: {{ .Values.postgres.image | quote }}
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - until pg_isready -h {{ include "suppline.fullname" . }}-postgres -p 5432 -U {{ .Values.postgres.auth.username }}; do sleep 2; done
        securityContext:
          runAsUser: {{ .Values.postgres.securityContext.runAsUser }}
          allowPrivilegeEscalation: false
      {{- end }}
      {{- if .Values.registry.enabled }}
      {{- include "suppline.registryCertInitContainer" . | nindent 6 }}
      {{- end }}
      {{- end }}
      containers:
      # Main application container
      - name: suppline
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        # Ports come from suppline.yml (server.port, observability.port).
        - name: api
          containerPort: {{ include "suppline.apiPort" . }}
          protocol: TCP
        - name: ops
          containerPort: {{ include "suppline.opsPort" . }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "suppline.fullname" . }}-config
        - secretRef:
            name: {{ include "suppline.fullname" . }}-secrets
        {{- if .Values.postgres.enabled }}
        - secretRef:
            name: {{ include "suppline.fullname" . }}-postgres
        {{- end }}
        env:
        # Default server.advertiseAddress host: other replicas reach this one here.
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Keep SBOM/vuln predicates on their own emptyDir so page cache from
        # other volumes does not collide with the cosign RSS spike (see backend.resources).
        - name: TMPDIR
          value: /tmp
        {{- if .Values.registry.enabled }}
        - name: SSL_CERT_FILE
          value: /registry-certs/ca-bundle.crt
        - name: REQUESTS_CA_BUNDLE
          value: /registry-certs/ca-bundle.crt
        - name: CURL_CA_BUNDLE
          value: /registry-certs/ca-bundle.crt
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /config
          readOnly: true
        - name: cache
          mountPath: /home/suppline/.cache
        {{- if .Values.registry.enabled }}
        - name: registry-cert
          mountPath: /registry-certs
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - 'wget -q --spider http://localhost:4954/healthz || exit 1'
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          {{- toYaml .Values.backend.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.backend.readinessProbe | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: {{ .Values.backend.securityContext.allowPrivilegeEscalation }}
          readOnlyRootFilesystem: {{ .Values.backend.securityContext.readOnlyRootFilesystem }}
          capabilities:
            {{- toYaml .Values.backend.securityContext.capabilities | nindent 12 }}
      # Trivy server sidecar
      - name: trivy
        image: "{{ .Values.trivy.image.repository }}:{{ .Values.trivy.image.tag }}"
        imagePullPolicy: {{ .Values.trivy.image.pullPolicy }}
        command:
        - /bin/sh
        - /trivy-json-logs.sh
        args:
        - server
        - --listen
        - 0.0.0.0:4954
        ports:
        - name: trivy
          containerPort: 4954
          protocol: TCP
        env:
        - name: TRIVY_CACHE_DIR
          value: /trivy-cache
        volumeMounts:
        - name: trivy-cache
          mountPath: /trivy-cache
        - name: trivy-logs
          mountPath: /trivy-json-logs.sh
          subPath: trivy-json-logs.sh
          readOnly: true
        resources:
          {{- toYaml .Values.trivy.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.trivy.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.trivy.readinessProbe | nindent 10 }}
        securityContext:
          {{- toYaml .Values.trivy.securityContext | nindent 10 }}
      volumes:
      - name: data
        emptyDir: {}
      - name: trivy-cache
      {{- if .Values.persistence.trivyCache.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "suppline.fullname" . }}-trivy-cache
      {{- else }}
        emptyDir:
          {{- with .Values.trivy.cacheSizeLimit }}
          sizeLimit: {{ . }}
          {{- end }}
      {{- end }}
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      {{- if .Values.registry.enabled }}
      - name: registry-cert
        emptyDir: {}
      {{- end }}
      - name: config
        configMap:
          name: {{ include "suppline.fullname" . }}-config
          items:
          - key: suppline.yml
            path: suppline.yml
      - name: trivy-logs
        configMap:
          name: {{ include "suppline.fullname" . }}-trivy-logs
          defaultMode: 0555
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.backend.replicaCount) 1 }}
      # Keep the leader and its standby on different nodes.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                {{- include "suppline.selectorLabels" . | nindent 16 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
