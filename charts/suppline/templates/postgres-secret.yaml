{{- if .Values.postgres.enabled }}
{{- $secretName := printf "%s-postgres" (include "suppline.fullname" .) }}
{{- $password := "" }}
{{- if .Values.postgres.auth.password }}
{{- $password = .Values.postgres.auth.password }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (index $existing.data "POSTGRES_PASSWORD") }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "suppline.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.auth.username ($password | urlquery) (include "suppline.fullname" .) .Values.postgres.auth.database | quote }}
{{- end }}
