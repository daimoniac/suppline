# Default values for suppline
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Backend configuration
backend:
  replicaCount: 1

  # Secrets - these can be set via values-secrets.yaml or environment variables
  # DO NOT commit actual secrets to git.
  # SUPPLINE_API_KEY is required when the API is enabled.
  # Triage reads SUPPLINE_LLM_API_KEY and the git credential variables named by
  # x-triage from this secret. Checkouts use the backend PVC at
  # /data/gitops (x-triage.checkout_dir). Example:
  #   SUPPLINE_LLM_API_KEY: ""
  #   GITOPS_INFRA_TOKEN: ""
  #   SUPPLINE_CONFIG_REPO_KEY: ""
  #   SUPPLINE_KNOWN_HOSTS: ""
  secrets: {}

  image:
    # Released images: ghcr.io/daimoniac/suppline:<semver> (see docs/RELEASE.md)
    repository: ghcr.io/daimoniac/suppline
    pullPolicy: IfNotPresent
    # Empty → Chart.AppVersion (set on each v* release)
    tag: ""

  # URL prefix to serve the web UI and API under, e.g. /suppline. Empty → /.
  # The backend serves everything under this path, so the ingress forwards
  # paths unchanged (no rewrite or prefix stripping).
  basePath: ""

  service:
    type: ClusterIP
    port: 8080
    metricsPort: 9090
    healthPort: 8081

  # Memory is dominated by attestation spikes, not the Go heap. A large SBOM/vuln
  # predicate is written to disk, then cosign parses it while Longhorn may still
  # hold dirty pages; those pages are not reclaimable until writeback, so the
  # cgroup OOMs instead of dropping cache. 1Gi/1536Mi limits clamp working set
  # and look like a leak. GOMEMLIMIT only covers heap (~hundreds of MiB) and
  # will not prevent these kills. Size for RSS + dirty cache + worker concurrency.
  # The in-process mirror now does the work the regsync sidecar used to do
  # (that sidecar requested 250m CPU / 256Mi). Leave these numbers as they are.
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "1000m"

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /health
      port: health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  env:
    LOG_LEVEL: "info"
    API_ENABLED: "true"
    API_READ_ONLY: "false"
    QUEUE_BUFFER_SIZE: "1000"
    WORKER_POLL_INTERVAL: "5m"
    WORKER_RETRY_ATTEMPTS: "3"
    WORKER_RETRY_BACKOFF: "10s"
    SCANNER_TIMEOUT: "5m"
    RESCAN_INTERVAL: "24h"
    # Cosign protobuf bundles via OCI referrers (sha256-<digest> fallback tag where referrers are
    # unsupported). Set "false" to write classic sha256-<digest>.att tags.
    ATTESTATION_NEW_BUNDLE_FORMAT: "true"

  # Optional: inline suppline.yml content (overrides the chart’s example file).
  # Prefer this for production so you do not edit files inside charts/suppline/.
  # supplineConfig: |
  #   version: 1
  #   ...

  attestationKey:
    enabled: true

# Trivy sidecar configuration
trivy:
  image:
    repository: aquasec/trivy
    tag: "0.76.2"
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  livenessProbe:
    tcpSocket:
      port: 4954
    initialDelaySeconds: 30
    periodSeconds: 30

  readinessProbe:
    tcpSocket:
      port: 4954
    initialDelaySeconds: 10
    periodSeconds: 10

# In-process mirror. Copies every sync entry, including x-suppline-ignore.
# Do not enable this together with the regsync sidecar.
mirror:
  enabled: true

# Regsync sidecar. Rollback path only. The chart refuses to render when this
# and mirror.enabled are both true, so a rollback cannot double-sync.
regsync:
  enabled: false
  replicaCount: 1

  image:
    repository: daimon666/regsync
    tag: "latest"
    pullPolicy: Always

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

# Ingress for the web UI and API (both served by the backend on its API port).
# Off by default: it needs a real host, and usually a class and TLS secret.
# The ingress path is backend.basePath (or / when that is empty).
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - suppline.example.com
  tls: []
  #  - secretName: suppline-tls
  #    hosts:
  #      - suppline.example.com

# Bundled PostgreSQL (default). Set enabled=false and persistence.data.enabled=true for SQLite.
postgres:
  enabled: true
  image: postgres:18-alpine
  auth:
    database: suppline
    username: suppline
    password: ""
  persistence:
    enabled: true
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  securityContext:
    runAsUser: 70
    fsGroup: 70

# Persistence configuration
persistence:
  # Data volume for SQLite when postgres.enabled is false.
  data:
    enabled: true
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}

  # Trivy cache volume
  trivyCache:
    enabled: false
    storageClassName: ""
    accessMode: ReadWrite
    size: 5Gi
    annotations: {}

# ServiceAccount configuration
serviceAccount:
  create: true
  annotations: {}
  name: "suppline"

# RBAC configuration
rbac:
  create: true

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

# Image pull secrets
imagePullSecrets: []

# Private Docker Registry (optional convenience — not the production default)
# Prefer bring-your-own Harbor/ECR/ACR/Artifactory: set registry.enabled=false (default)
# and provide SUPPLINE_REGISTRY_* (+ upstream creds) via values-secrets.yaml.
# Those env vars are available in suppline.yml via {{ env "…" }}.
# The bundled registry:3 is for labs / bootstrap only — do not treat it as a long-term prod registry.
registry:
  enabled: false

  # Image configuration
  image:
    repository: registry
    tag: 3.1.2
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    type: ClusterIP
    port: 5000

  # Persistence for registry data
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: ""

  # Registry credentials
  # If not provided, username defaults to "suppline" and password is auto-generated
  # credentials:
  #   username: ""  # Leave empty for default "suppline"
  #   password: ""  # Leave empty for auto-generated password

  # Registry secrets
  # htpasswd will be automatically generated from credentials
  # secrets:
  #   haSharedSecret: ""  # Optional: shared secret for registry security

  # Resources
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Security context
  securityContext:
    enabled: true
    runAsUser: 1000
    fsGroup: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
