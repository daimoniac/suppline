# Example sync/policy config shipped with the Helm chart.
# Replace for production: set backend.supplineConfig in values, or overwrite this file
# before packaging. Prefer bring-your-own registry via SUPPLINE_REGISTRY_* secrets.
version: 1

# Runtime settings (read at startup). Secrets stay in environment variables.
server:
  port: 8080
  # Where the other replicas reach this one (POD_IP comes from the chart).
  advertiseAddress: 'http://{{ env "POD_IP" }}:8080'
  basePath: ""          # e.g. /suppline; also the chart's ingress path
observability:
  port: 9090            # /metrics, /health, /ready
scanner:
  server: localhost:4954  # Trivy sidecar

creds:
  - registry: registry-1.docker.io
    user: '{{ env "DOCKER_USERNAME" }}'
    pass: '{{ env "DOCKER_PASSWORD" }}'
    repoAuth: false
    reqPerSec: 10
    reqConcurrent: 10
  - registry: docker.io
    user: '{{ env "DOCKER_USERNAME" }}'
    pass: '{{ env "DOCKER_PASSWORD" }}'
    repoAuth: false
    reqPerSec: 10
    reqConcurrent: 10
  - registry: '{{ env "SUPPLINE_REGISTRY_URL" }}'
    user: '{{ env "SUPPLINE_REGISTRY_USERNAME" }}'
    pass: '{{ env "SUPPLINE_REGISTRY_PASSWORD" }}'
    repoAuth: false

defaults:
  parallel: 2
  interval: 60m
  cleanupTags: true
  cleanupTagsExclude:
    - ".*\\.sig$"
    - ".*\\.att$"
  rescanInterval: 7d
  worker-poll-interval: 5m
  worker-concurrency: 3
  worker-retry-attempts: 3
  worker-retry-backoff: 10s
  queue-buffer-size: 1000
  scaiValidityExtension: 7d
  # Vulnerability and SBOM bundles are what Kyverno downloads on every SCAI check.
  createVulnerabilityAttestation: false
  createSBOMAttestation: false
  vex-repo: false
  # No `policy:` here, so every repository gets the built-in default: no
  # critical and no known-exploited (CISA KEV) high vulnerabilities. Set
  # `policy.expression` to replace it; see docs/POLICY.md.

sync:
  # Point targets at YOUR registry (Harbor/ECR/ACR/… or the chart’s bundled registry URL).
  - source: public.ecr.aws/docker/library/busybox:1.36.1
    target: '{{ env "SUPPLINE_REGISTRY_URL" }}/busybox:1.36.1'
    type: image
    platform: linux/amd64
